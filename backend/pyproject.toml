[project]
name = "mini-agent-backend"
version = "0.1.0"
description = "mini-agent 本地 Agent 应用后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.2",
    "apscheduler>=3.11,<4",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26",
    "mcp>=1.26,<2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
